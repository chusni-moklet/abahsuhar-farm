<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Abah Suhar Farm Finance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            farm: {
              50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0',
              300: '#86efac', 400: '#4ade80', 500: '#22c55e',
              600: '#16a34a', 700: '#15803d', 800: '#166534',
              900: '#14532d', 950: '#052e16'
            }
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'pulse-slow': 'pulse 3s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-20px)' },
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .bg-farm-gradient {
      background: linear-gradient(135deg, #052e16 0%, #14532d 40%, #166534 70%, #15803d 100%);
    }
    .input-field {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      transition: all 0.3s ease;
    }
    .input-field:focus {
      background: rgba(255,255,255,0.12);
      border-color: #4ade80;
      box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.15);
      outline: none;
    }
    .btn-login {
      background: linear-gradient(135deg, #16a34a, #15803d);
      transition: all 0.3s ease;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #15803d, #14532d);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(22, 163, 74, 0.4);
    }
    .btn-login:active { transform: translateY(0); }
    .leaf { position: absolute; opacity: 0.08; }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(74, 222, 128, 0.3);
      animation: float 6s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-farm-gradient min-h-screen flex items-center justify-center overflow-hidden relative">

  <!-- Background Decorations -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="particle w-4 h-4 top-1/4 left-1/6" style="animation-delay:0s"></div>
    <div class="particle w-6 h-6 top-3/4 left-1/4" style="animation-delay:1s"></div>
    <div class="particle w-3 h-3 top-1/3 right-1/4" style="animation-delay:2s"></div>
    <div class="particle w-5 h-5 top-2/3 right-1/6" style="animation-delay:3s"></div>
    <div class="particle w-8 h-8 top-1/2 left-1/2" style="animation-delay:1.5s; opacity:0.1"></div>
    <i class="leaf fa-solid fa-leaf text-8xl text-farm-400 top-10 left-10 rotate-45" style="position:absolute; opacity:0.06; font-size:8rem;"></i>
    <i class="leaf fa-solid fa-seedling text-8xl text-farm-400 bottom-10 right-10" style="position:absolute; opacity:0.06; font-size:6rem;"></i>
    <i class="leaf fa-solid fa-tree text-8xl text-farm-400 top-1/2 right-20" style="position:absolute; opacity:0.04; font-size:10rem;"></i>
  </div>

  <!-- Login Card -->
  <div class="glass rounded-3xl p-8 w-full max-w-md mx-4 animate__animated animate__fadeInUp animate__faster relative z-10">
    
    <!-- Logo & Title -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-farm-500 to-farm-700 mb-4 shadow-lg shadow-farm-900/50">
        <i class="fa-solid fa-tractor text-white text-3xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-white mb-1">Abah Suhar Farm</h1>
      <p class="text-farm-300 text-sm">Sistem Keuangan & Laporan Usaha</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-farm-300 text-sm font-medium mb-2">
          <i class="fa-solid fa-envelope mr-2"></i>Email Admin
        </label>
        <input
          type="email"
          id="email"
          placeholder="Masukkan email admin"
          class="input-field w-full px-4 py-3 rounded-xl text-white placeholder-gray-500 text-sm"
          required
        />
        <p id="emailError" class="text-red-400 text-xs mt-1 hidden">Email tidak valid</p>
      </div>

      <div>
        <label class="block text-farm-300 text-sm font-medium mb-2">
          <i class="fa-solid fa-lock mr-2"></i>Password
        </label>
        <div class="relative">
          <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            class="input-field w-full px-4 py-3 pr-12 rounded-xl text-white placeholder-gray-500 text-sm"
            required
          />
          <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-farm-400 transition-colors">
            <i class="fa-solid fa-eye" id="eyeIcon"></i>
          </button>
        </div>
        <p id="passwordError" class="text-red-400 text-xs mt-1 hidden">Password minimal 6 karakter</p>
      </div>

      <div class="flex items-center justify-between">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded accent-farm-500" />
          <span class="text-farm-300 text-sm">Ingat saya</span>
        </label>
      </div>

      <button type="submit" id="loginBtn" class="btn-login w-full py-3 rounded-xl text-white font-semibold text-sm flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i>
        <span id="loginBtnText">Masuk ke Dashboard</span>
      </button>
    </form>

    <!-- Footer -->
    <div class="mt-6 text-center">
      <p class="text-gray-500 text-xs">
        <i class="fa-solid fa-shield-halved mr-1 text-farm-600"></i>
        Sistem dilindungi enkripsi & session management
      </p>
    </div>

    <!-- Version -->
    <div class="mt-4 text-center">
      <span class="text-gray-600 text-xs">v1.0.0 &bull; Abah Suhar Farm Finance</span>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    });

    // Login form submit
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('rememberMe').checked;

      // Validation
      let valid = true;
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById('emailError').classList.remove('hidden');
        valid = false;
      } else {
        document.getElementById('emailError').classList.add('hidden');
      }
      if (!password || password.length < 6) {
        document.getElementById('passwordError').classList.remove('hidden');
        valid = false;
      } else {
        document.getElementById('passwordError').classList.add('hidden');
      }
      if (!valid) return;

      // Show loading
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('loginBtnText');
      btn.disabled = true;
      btnText.textContent = 'Memverifikasi...';
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i><span>Memverifikasi...</span>';

      try {
        const result = await Auth.login(email, password, remember);
        if (result.success) {
          Swal.fire({
            icon: 'success',
            title: 'Login Berhasil!',
            text: `Selamat datang, ${result.user.email}`,
            background: '#14532d',
            color: '#fff',
            iconColor: '#4ade80',
            confirmButtonColor: '#16a34a',
            timer: 1500,
            showConfirmButton: false
          }).then(() => {
            window.location.href = 'dashboard.html';
          });
        } else {
          Swal.fire({
            icon: 'error',
            title: 'Login Gagal',
            text: result.message || 'Email atau password salah',
            background: '#14532d',
            color: '#fff',
            iconColor: '#f87171',
            confirmButtonColor: '#16a34a'
          });
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-2"></i><span id="loginBtnText">Masuk ke Dashboard</span>';
        }
      } catch (err) {
        Swal.fire({
          icon: 'error',
          title: 'Terjadi Kesalahan',
          text: 'Gagal terhubung ke server. Coba lagi.',
          background: '#14532d',
          color: '#fff',
          confirmButtonColor: '#16a34a'
        });
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-2"></i><span id="loginBtnText">Masuk ke Dashboard</span>';
      }
    });

    // Check if already logged in
    if (localStorage.getItem('farm_session')) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
